# Source: actions/setup-python README (github.com/actions/setup-python), adapted for this repo's
# locked decisions D-01..D-10 (see .planning/phases/11-foundation/11-RESEARCH.md)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest src/tests/ -v

      - name: Install pip-audit
        if: ${{ !cancelled() }}
        run: pip install pip-audit

      - name: Audit dependencies
        if: ${{ !cancelled() }}
        run: pip-audit -r requirements.txt
